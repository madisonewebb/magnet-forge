[project]
name = "magnet-forge-format"
version = "0.1.0"
description = "Reference implementation of the Magnet Forge project file format (schema version 1)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magnet_forge_format"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
