[project]
name = "magnet-forge-processing"
version = "0.1.0"
description = "Magnet Forge processing service (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "magnet-forge-format",
    "pillow>=11.0",
    "python-multipart>=0.0.12",
]

[tool.uv.sources]
magnet-forge-format = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magnet_forge_processing"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
