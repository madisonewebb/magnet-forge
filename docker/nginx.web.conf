# Minimal static-file server config for the Magnet Forge web app, served by
# nginxinc/nginx-unprivileged (listens on 8080 as a non-root user by
# default). Overrides the image's default.conf.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
